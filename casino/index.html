<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Huff N' Even More Puff</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #111;
    }


    /* =============================
       MAIN PAGE
    ============================= */

    .promo-page {
      position: relative;

      width: 100%;
      min-height: 100vh;

      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.25)
        ),
        url("background.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    /* =============================
       DARK EDGE EFFECT
    ============================= */

    .promo-page::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 35%,
          rgba(0, 0, 0, 0.38) 100%
        );
    }


    /* =============================
       CONTENT
    ============================= */

    .content {
      position: relative;
      z-index: 10;

      width: 100%;
      max-width: 1000px;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding:
        20px
        20px
        28px;
    }


    /* =============================
       GAME LOGO
    ============================= */

    .logo {
      width: min(580px, 88vw);

      display: block;

      object-fit: contain;

      filter:
        drop-shadow(
          0 10px 8px rgba(0, 0, 0, 0.38)
        );

      animation:
        logoFloat
        3s ease-in-out
        infinite;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }


    /* =============================
       PROMOTION AREA
    ============================= */

    .offer-area {
      position: relative;

      width: min(780px, 95vw);

      min-height: 560px;

      display: flex;
      justify-content: center;
      align-items: flex-end;
    }


    /* =============================
       WOLF
    ============================= */

    .wolf {
      position: absolute;

      width: min(470px, 72vw);

      top: -20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 2;

      filter:
        drop-shadow(
          0 15px 15px rgba(0, 0, 0, 0.45)
        );

      animation:
        wolfMove
        2.8s ease-in-out
        infinite;
    }

    @keyframes wolfMove {

      0%,
      100% {
        transform:
          translateX(-50%)
          translateY(0);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-7px);
      }

    }


    /* =============================
       WOOD OFFER BOARD
    ============================= */

    .offer-board {
      position: relative;

      z-index: 5;

      width: min(680px, 92vw);

      margin-bottom: 18px;

      padding:
        45px
        35px
        35px;

      text-align: center;

      border:
        8px solid #5b260b;

      border-radius: 24px;

      background:
        linear-gradient(
          90deg,
          #7d330d 0%,
          #b45b18 20%,
          #8c3d0e 48%,
          #bd681f 72%,
          #71300d 100%
        );

      box-shadow:
        0 20px 30px rgba(0, 0, 0, 0.5),
        inset 0 0 0 5px rgba(255, 206, 90, 0.20),
        inset 0 0 30px rgba(0, 0, 0, 0.40);

      transform: rotate(-1deg);
    }


    /* WOOD LINES */

    .offer-board::before,
    .offer-board::after {
      content: "";

      position: absolute;

      left: 4%;
      width: 92%;

      height: 4px;

      background:
        rgba(61, 20, 2, 0.45);

      border-radius: 50%;
    }

    .offer-board::before {
      top: 32%;
    }

    .offer-board::after {
      top: 68%;
    }


    /* =============================
       BOARD NAILS
    ============================= */

    .nail {
      position: absolute;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 35%,
          #ffffff,
          #969696 32%,
          #444444 70%
        );

      box-shadow:
        0 2px 3px rgba(0,0,0,.6);

      z-index: 8;
    }

    .nail.one {
      top: 14px;
      left: 14px;
    }

    .nail.two {
      top: 14px;
      right: 14px;
    }

    .nail.three {
      bottom: 14px;
      left: 14px;
    }

    .nail.four {
      bottom: 14px;
      right: 14px;
    }


    /* =============================
       OFFER TEXT
    ============================= */

    .offer-small {
      display: block;

      margin-bottom: 5px;

      color: #fff3bf;

      font-size:
        clamp(
          17px,
          3vw,
          24px
        );

      font-weight: 900;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-shadow:
        0 3px 2px rgba(0,0,0,.45);
    }


    .offer-main {
      display: block;

      color: #ffd726;

      font-size:
        clamp(
          50px,
          10vw,
          88px
        );

      line-height: .95;

      font-weight: 1000;

      letter-spacing: -2px;

      text-shadow:
        0 4px 0 #8c3800,
        0 7px 0 #552000,
        0 11px 12px rgba(0,0,0,.55);
    }


    .offer-title {
      display: block;

      margin-top: 14px;

      color: #ffffff;

      font-size:
        clamp(
          25px,
          5vw,
          42px
        );

      line-height: 1.05;

      font-weight: 1000;

      text-transform: uppercase;

      text-shadow:
        0 4px 0 #541b05,
        0 8px 8px rgba(0,0,0,.45);
    }


    .free-spins {
      display: block;

      margin-top: 16px;

      padding:
        12px
        15px;

      border-radius: 14px;

      color: #fff;

      font-size:
        clamp(
          28px,
          5.5vw,
          48px
        );

      font-weight: 1000;

      text-transform: uppercase;

      background:
        linear-gradient(
          #dc2318,
          #9c0905
        );

      border:
        3px solid #ffdc55;

      text-shadow:
        0 4px 0 rgba(80,0,0,.8);

      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.3),
        0 5px 10px rgba(0,0,0,.3);
    }


    /* =============================
       JOIN BUTTON
    ============================= */

    .join-btn {
      position: relative;
      z-index: 12;

      min-width: 260px;

      margin-top: 5px;

      padding:
        20px
        45px;

      border: none;

      border-radius: 18px;

      cursor: pointer;

      color: #381500;

      font-size:
        clamp(
          25px,
          5vw,
          34px
        );

      font-weight: 1000;

      text-transform: uppercase;

      background:
        linear-gradient(
          180deg,
          #fff65a 0%,
          #ffc400 45%,
          #ff9300 100%
        );

      border:
        4px solid #7b2a00;

      box-shadow:
        0 8px 0 #662000,
        0 15px 25px rgba(0,0,0,.35),
        inset 0 3px 0 rgba(255,255,255,.65);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .join-btn:hover {
      transform:
        translateY(-4px)
        scale(1.04);

      box-shadow:
        0 11px 0 #662000,
        0 20px 28px rgba(0,0,0,.4),
        inset 0 3px 0 rgba(255,255,255,.65);
    }


    .join-btn:active {
      transform: translateY(5px);

      box-shadow:
        0 3px 0 #662000,
        0 8px 12px rgba(0,0,0,.35);
    }


    /* =============================
       FOOTER
    ============================= */

    .footer {
      position: relative;

      z-index: 12;

      margin-top: 25px;

      padding:
        8px
        14px;

      color: #fff;

      font-size: 13px;

      font-weight: 700;

      text-align: center;

      border-radius: 10px;

      background:
        rgba(0,0,0,.48);

      text-shadow:
        0 2px 2px #000;
    }


    /* =============================
       MOBILE
    ============================= */

    @media (max-width: 600px) {

      .content {
        padding:
          12px
          12px
          20px;
      }

      .logo {
        width: 88vw;
      }

      .offer-area {
        min-height: 520px;
      }

      .wolf {
        width: 75vw;
        top: 5px;
      }

      .offer-board {
        width: 94vw;

        padding:
          38px
          18px
          25px;
      }

      .join-btn {
        width: 85vw;
        max-width: 390px;
      }

    }


    @media (max-width: 390px) {

      .offer-area {
        min-height: 470px;
      }

      .wolf {
        width: 78vw;
      }

      .offer-board {
        padding-top: 32px;
      }

    }

  </style>
</head>


<body>

  <main class="promo-page">


    <div class="content">


      <!-- HUFF N EVEN MORE PUFF LOGO -->

      <img
        src="wording.png"
        alt="Huff N Even More Puff"
        class="logo"
      >


      <!-- MAIN CHARACTER + OFFER -->

      <section class="offer-area">


        <!-- WOLF -->

        <img
          src="icon(2).png"
          alt="Huff N Puff Wolf"
          class="wolf"
        >


        <!-- OFFER BOARD -->

        <div class="offer-board">

          <span class="nail one"></span>
          <span class="nail two"></span>
          <span class="nail three"></span>
          <span class="nail four"></span>


          <span class="offer-small">
            GET YOUR
          </span>


          <span class="offer-main">
            100%
          </span>


          <span class="offer-title">
            Casino Deposit Match
          </span>


          <span class="free-spins">
            + 10 Free Spins
          </span>

        </div>

      </section>


      <!-- JOIN NOW BUTTON -->

      <button
        class="claim-btn"
        id="claimnow"
      >
        Claim Now!
      </button>


      <!-- RESPONSIBLE GAMBLING -->

      <div class="footer">
        18+ • PLAY RESPONSIBLY • T&Cs APPLY
      </div>


    </div>

  </main>



  <script>

    /*
    ================================
    BETZILLO REDIRECT

    */

    const redirectURL =
      "https://record.betzillopartners.com/_Lu3m47EoZY6ZM7hnoUx_dWNd7ZgqdRLk/12/";


    document
      .getElementById("joinNow")
      .addEventListener("click", function () {

        window.location.href =
          redirectURL;

      });

  </script>

</body>

</html>
