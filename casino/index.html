    :root{--gold:#ffd83d;--orange:#ff8a00;--brown:#4b1808;--cream:#fff7cf}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial Black,Arial,sans-serif}
    body{background:#112810;color:#fff}.page{position:relative;min-height:100svh;overflow:hidden;display:grid;place-items:center;padding:18px;background:url('assets/background.jpg') center/cover no-repeat}

    .board{position:relative;z-index:7;width:min(620px,94vw);margin-bottom:8px;padding:43px 34px 34px;border:10px solid #4d1b07;border-radius:24px;background:repeating-linear-gradient(0deg,transparent 0 68px,#69300f55 69px 73px),linear-gradient(95deg,#77300c,#bb651c 20%,#8c3d0e 48%,#c97725 72%,#6a280a);box-shadow:0 18px 0 #301004,0 28px 36px #0009,inset 0 0 0 5px #f6c46b33,inset 0 0 32px #2b0e08aa;transform:rotate(-.7deg)}
    .board:after{content:"";position:absolute;inset:10px;border:2px dashed #f8c56855;border-radius:12px;pointer-events:none}.nail{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a9a9a9 28%,#393939 75%);box-shadow:0 2px 3px #000}.n1{top:16px;left:16px}.n2{top:16px;right:16px}.n3{bottom:16px;left:16px}.n4{bottom:16px;right:16px}
    .eyebrow{display:block;color:var(--cream);font-size:clamp(16px,3.2vw,23px);letter-spacing:2px;text-shadow:0 3px 2px #391000}.percent{display:block;color:var(--gold);font-size:clamp(68px,15vw,112px);line-height:.88;letter-spacing:-4px;text-shadow:0 4px 0 #b84a00,0 8px 0 #642100,0 12px 16px #0008}.match{display:block;margin-top:14px;font-size:clamp(25px,5.5vw,42px);line-height:1;color:#fff;text-transform:uppercase;text-shadow:0 4px 0 #4d1604,0 8px 10px #0008}.spins{display:block;margin:20px auto 0;padding:12px 15px;border:3px solid #ffdf64;border-radius:14px;background:linear-gradient(#e63520,#a60704);font-size:clamp(27px,6vw,46px);line-height:1;color:#fff;text-transform:uppercase;text-shadow:0 4px 0 #650000;box-shadow:inset 0 2px #ffffff66,0 7px 10px #0005}
    .cta{display:inline-grid;place-items:center;position:relative;z-index:12;min-width:min(390px,86vw);padding:19px 42px;margin-top:10px;border:4px solid #6b2200;border-radius:18px;background:linear-gradient(#fff66a,#ffc51b 48%,#ff8500);box-shadow:0 8px 0 #5d1c00,0 17px 25px #0007,inset 0 3px #fff9a8;color:#3b1300;font-size:clamp(25px,5vw,36px);font-weight:1000;text-decoration:none;text-transform:uppercase;letter-spacing:.5px;transition:.16s ease;animation:pulse 2.2s ease-in-out infinite}.cta:hover{transform:translateY(-4px) scale(1.035);filter:brightness(1.08)}.cta:active{transform:translateY(5px);box-shadow:0 3px 0 #5d1c00,0 8px 12px #0007}.sub{margin:12px 0 0;font:700 12px/1.4 Arial,sans-serif;color:#fff;text-shadow:0 2px 3px #000;background:#0008;border-radius:9px;padding:7px 12px}
    @keyframes float{50%{transform:translateY(-7px)}}@keyframes wolf{50%{transform:translateX(-50%) translateY(-6px)}}@keyframes pulse{50%{filter:brightness(1.12);box-shadow:0 8px 0 #5d1c00,0 17px 30px #ffc40066,inset 0 3px #fff9a8}}@keyframes drift{to{background-position:195px 220px,360px 350px}}
    @media(max-width:600px){.page{padding:8px}.shell{min-height:calc(100svh - 16px)}.logo{width:82vw;margin-bottom:-35px}.scene{height:490px}.wolf{width:68vw}.board{padding:38px 18px 27px}.paw{top:220px;width:59px;height:62px}.paw.left{left:4%}.paw.right{right:4%}.cta{padding:17px 30px}.sub{font-size:10px}}
    @media(max-width:390px){.scene{height:455px}.wolf{top:10px}.paw{top:205px}.board{border-width:7px}.spins{margin-top:14px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
