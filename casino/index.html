<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#173b16">

  <title>Huff N' Even More Puff — Casino Offer</title>

  <style>
    :root {
      --gold: #ffd83d;
      --cream: #fff7cf;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;

      font-family: "Arial Black", Arial, sans-serif;
    }

    body {
      color: #ffffff;
      background-color: #112810;
    }

    /* MAIN PAGE */

    .page {
      position: relative;

      display: grid;
      place-items: center;

      width: 100%;
      min-height: 100svh;

      padding: 18px;

      overflow: hidden;

      background-image:
        url("/casino/background.jpg");

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* BACKGROUND SHADING */

    .page::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 0;

      background:
        linear-gradient(
          180deg,
          rgba(2, 17, 4, 0.06),
          rgba(3, 24, 5, 0.10) 45%,
          rgba(0, 0, 0, 0.48)
        ),
        radial-gradient(
          circle at 50% 45%,
          transparent 25%,
          rgba(0, 0, 0, 0.32) 100%
        );

      pointer-events: none;
    }

    /* SPARKLES */

    .sparkles {
      position: absolute;
      inset: 0;

      z-index: 1;

      opacity: 0.55;

      pointer-events: none;

      background-image:
        radial-gradient(
          circle,
          #fff39a 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle,
          #ffd32a 0 3px,
          transparent 4px
        );

      background-size:
        180px 180px,
        260px 260px;

      background-position:
        15px 40px,
        100px 90px;

      animation:
        sparkleMove
        8s linear
        infinite;
    }

    /* MAIN CONTENT */

    .shell {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: min(760px, 100%);

      min-height:
        min(
          960px,
          calc(100svh - 36px)
        );

      gap: 6px;

      text-align: center;
    }

    /* GAME LOGO */

    .logo {
      position: relative;
      z-index: 6;

      display: block;

      width: min(480px, 78vw);
      height: auto;

      margin-bottom: -54px;

      filter:
        drop-shadow(
          0 10px 8px rgba(0, 0, 0, 0.42)
        );

      animation:
        logoFloat
        3.2s ease-in-out
        infinite;
    }

    /* WOLF AND BOARD AREA */

    .scene {
      position: relative;

      display: grid;
      place-items: end center;

      width: min(690px, 96vw);
      height: 570px;
    }

    /* WOLF */

    .wolf {
      position: absolute;
      z-index: 5;

      top: 0;
      left: 50%;

      width: min(360px, 60vw);
      height: auto;

      transform: translateX(-50%);

      filter:
        drop-shadow(
          0 13px 10px rgba(0, 0, 0, 0.48)
        );

      animation:
        wolfMove
        3s ease-in-out
        infinite;
    }

    /* WOLF PAWS */

    .paw {
      position: absolute;
      z-index: 8;

      top: 266px;

      width: 74px;
      height: 76px;

      border: 4px solid #343b79;
      border-radius: 48% 48% 40% 40%;

      background:
        radial-gradient(
          circle at 50% 20%,
          #cbd4f6,
          #8792cc 55%,
          #606aa4
        );

      box-shadow:
        0 6px 7px rgba(0, 0, 0, 0.40);
    }

    .paw::before,
    .paw::after {
      content: "";

      position: absolute;
      top: -6px;

      width: 23px;
      height: 27px;

      border: 3px solid #4b548f;
      border-radius: 50%;

      background: #aeb9e9;
    }

    .paw::before {
      left: 5px;
    }

    .paw::after {
      right: 5px;
    }

    .paw-left {
      left: calc(50% - 260px);

      transform: rotate(16deg);
    }

    .paw-right {
      right: calc(50% - 260px);

      transform: rotate(-16deg);
    }

    /* WOODEN OFFER BOARD */

    .offer-board {
      position: relative;
      z-index: 7;

      width: min(620px, 94vw);

      margin-bottom: 8px;

      padding:
        43px
        34px
        34px;

      border: 10px solid #4d1b07;
      border-radius: 24px;

      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 68px,
          rgba(105, 48, 15, 0.33) 69px 73px
        ),
        linear-gradient(
          95deg,
          #77300c,
          #bb651c 20%,
          #8c3d0e 48%,
          #c97725 72%,
          #6a280a
        );

      box-shadow:
        0 18px 0 #301004,
        0 28px 36px rgba(0, 0, 0, 0.60),
        inset 0 0 0 5px rgba(246, 196, 107, 0.20),
        inset 0 0 32px rgba(43, 14, 8, 0.65);

      transform: rotate(-0.7deg);
    }

    .offer-board::after {
      content: "";

      position: absolute;
      inset: 10px;

      border:
        2px dashed rgba(248, 197, 104, 0.33);

      border-radius: 12px;

      pointer-events: none;
    }

    /* BOARD NAILS */

    .nail {
      position: absolute;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff,
          #a9a9a9 28%,
          #393939 75%
        );

      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.60);
    }

    .nail-one {
      top: 16px;
      left: 16px;
    }

    .nail-two {
      top: 16px;
      right: 16px;
    }

    .nail-three {
      bottom: 16px;
      left: 16px;
    }

    .nail-four {
      right: 16px;
      bottom: 16px;
    }

    /* OFFER TEXT */

    .offer-small {
      display: block;

      color: var(--cream);

      font-size:
        clamp(
          16px,
          3.2vw,
          23px
        );

      font-weight: 900;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-shadow:
        0 3px 2px #391000;
    }

    .offer-percent {
      display: block;

      color: var(--gold);

      font-size:
        clamp(
          68px,
          15vw,
          112px
        );

      line-height: 0.88;

      font-weight: 1000;

      letter-spacing: -4px;

      text-shadow:
        0 4px 0 #b84a00,
        0 8px 0 #642100,
        0 12px 16px rgba(0, 0, 0, 0.53);
    }

    .offer-title {
      display: block;

      margin-top: 14px;

      color: #ffffff;

      font-size:
        clamp(
          25px,
          5.5vw,
          42px
        );

      line-height: 1;

      font-weight: 1000;

      text-transform: uppercase;

      text-shadow:
        0 4px 0 #4d1604,
        0 8px 10px rgba(0, 0, 0, 0.53);
    }

    .free-spins {
      display: block;

      margin:
        20px
        auto
        0;

      padding:
        12px
        15px;

      border: 3px solid #ffdf64;
      border-radius: 14px;

      color: #ffffff;

      font-size:
        clamp(
          27px,
          6vw,
          46px
        );

      line-height: 1;

      font-weight: 1000;

      text-transform: uppercase;

      background:
        linear-gradient(
          #e63520,
          #a60704
        );

      text-shadow:
        0 4px 0 #650000;

      box-shadow:
        inset 0 2px rgba(255, 255, 255, 0.40),
        0 7px 10px rgba(0, 0, 0, 0.33);
    }

    /* CLAIM NOW BUTTON */

    .claim-button {
      position: relative;
      z-index: 12;

      display: inline-grid;
      place-items: center;

      min-width:
        min(
          390px,
          86vw
        );

      margin-top: 10px;

      padding:
        19px
        42px;

      border: 4px solid #6b2200;
      border-radius: 18px;

      color: #3b1300;

      font-size:
        clamp(
          25px,
          5vw,
          36px
        );

      font-weight: 1000;

      letter-spacing: 0.5px;

      text-decoration: none;
      text-transform: uppercase;

      background:
        linear-gradient(
          #fff66a,
          #ffc51b 48%,
          #ff8500
        );

      box-shadow:
        0 8px 0 #5d1c00,
        0 17px 25px rgba(0, 0, 0, 0.47),
        inset 0 3px #fff9a8;

      transition:
        transform 0.16s ease,
        filter 0.16s ease;

      animation:
        buttonPulse
        2.2s ease-in-out
        infinite;
    }

    .claim-button:hover {
      transform:
        translateY(-4px)
        scale(1.035);

      filter: brightness(1.08);
    }

    .claim-button:active {
      transform: translateY(5px);

      box-shadow:
        0 3px 0 #5d1c00,
        0 8px 12px rgba(0, 0, 0, 0.47);
    }

    /* FOOTER */

    .footer {
      margin:
        12px
        0
        0;

      padding:
        7px
        12px;

      border-radius: 9px;

      color: #ffffff;

      font:
        700
        12px/1.4
        Arial,
        sans-serif;

      background:
        rgba(0, 0, 0, 0.53);

      text-shadow:
        0 2px 3px #000000;
    }

    /* ANIMATIONS */

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes wolfMove {
      0%,
      100% {
        transform:
          translateX(-50%)
          translateY(0);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-6px);
      }
    }

    @keyframes buttonPulse {
      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.12);

        box-shadow:
          0 8px 0 #5d1c00,
          0 17px 30px rgba(255, 196, 0, 0.40),
          inset 0 3px #fff9a8;
      }
    }

    @keyframes sparkleMove {
      to {
        background-position:
          195px 220px,
          360px 350px;
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .page {
        padding: 8px;
      }

      .shell {
        min-height:
          calc(100svh - 16px);
      }

      .logo {
        width: 82vw;
        margin-bottom: -35px;
      }

      .scene {
        height: 490px;
      }

      .wolf {
        width: 68vw;
      }

      .offer-board {
        padding:
          38px
          18px
          27px;
      }

      .paw {
        top: 220px;

        width: 59px;
        height: 62px;
      }

      .paw-left {
        left: 4%;
      }

      .paw-right {
        right: 4%;
      }

      .claim-button {
        padding:
          17px
          30px;
      }

      .footer {
        font-size: 10px;
      }
    }

    @media (max-width: 390px) {
      .scene {
        height: 455px;
      }

      .wolf {
        top: 10px;
      }

      .paw {
        top: 205px;
      }

      .offer-board {
        border-width: 7px;
      }

      .free-spins {
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div
      class="sparkles"
      aria-hidden="true"
    ></div>


    <section
      class="shell"
      aria-label="Casino welcome offer"
    >

      <!-- HUFF N' PUFF LOGO -->

      <img
        class="logo"
        src="/casino/logo.png"
        alt="Huff N' Even More Puff"
      >


      <!-- WOLF AND OFFER BOARD -->

      <div class="scene">

        <img
          class="wolf"
          src="/casino/wolf.png"
          alt="Huff N' Puff wolf holding the offer board"
        >


        <!-- WOLF PAWS -->

        <i
          class="paw paw-left"
          aria-hidden="true"
        ></i>

        <i
          class="paw paw-right"
          aria-hidden="true"
        ></i>


        <!-- WOODEN OFFER BOARD -->

        <div class="offer-board">

          <i class="nail nail-one"></i>
          <i class="nail nail-two"></i>
          <i class="nail nail-three"></i>
          <i class="nail nail-four"></i>


          <span class="offer-small">
            Welcome Offer
          </span>


          <strong class="offer-percent">
            100%
          </strong>


          <strong class="offer-title">
            Casino Deposit Match
          </strong>


          <strong class="free-spins">
            + 10 Free Spins
          </strong>

        </div>

      </div>


      <!-- CLAIM NOW BUTTON -->

      <a
        class="claim-button"
        href="https://record.betzillopartners.com/_Lu3m47EoZY6ZM7hnoUx_dWNd7ZgqdRLk/12/"
        aria-label="Claim the welcome offer now"
      >
        Claim Now!
      </a>


      <!-- RESPONSIBLE GAMBLING -->

      <p class="footer">
        18+ • T&amp;Cs APPLY • PLAY RESPONSIBLY
      </p>

    </section>

  </main>

</body>
</html>
