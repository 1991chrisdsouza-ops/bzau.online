<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13051f">

  <title>Play 10, Get 50 - Sports Credit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: #160524;
      --gold: #ffc400;
      --white: #ffffff;
      --muted: #cabfd5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Roboto", Arial, sans-serif;
      color: var(--white);
      background-color: #0b0213;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;

      /*
        Upload sports-finals-background.png
        in the same folder as this HTML file.
      */
      background-image:
        linear-gradient(
          90deg,
          rgba(7, 1, 13, 0.35),
          rgba(10, 2, 19, 0.76) 34%,
          rgba(10, 2, 19, 0.76) 66%,
          rgba(7, 1, 13, 0.35)
        ),
        linear-gradient(
          0deg,
          rgba(5, 1, 10, 0.9),
          transparent 55%
        ),
        url("sports-finals-background.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(119, 35, 210, 0.25),
          transparent 40%
        );
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      padding: 35px 22px 24px;
      text-align: center;
    }

    .event-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 0 10px;

      color: #f2eafd;
      font-family: "Anton", sans-serif;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
    }

    .event-title::before,
    .event-title::after {
      content: "";
      width: 54px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        #a842ff
      );
    }

    .event-title::after {
      transform: scaleX(-1);
    }

    .headline {
      margin: 0;
      color: #ffffff;
      font-family: "Anton", sans-serif;
      font-size: clamp(66px, 13vw, 112px);
      font-weight: 400;
      letter-spacing: -1px;
      line-height: 0.86;
      text-transform: uppercase;
      text-shadow: 0 7px 22px #000000;
    }

    .headline .gold {
      display: block;
      margin-top: 8px;
      font-size: 1.19em;

      background:
        linear-gradient(
          #ffe46d 2%,
          #ffc400 42%,
          #e49a00
        );

      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px #ffd739;

      filter: drop-shadow(0 5px 0 #7c4b00);
    }

    .credit-title {
      margin: 15px 0 24px;
      font-family: "Anton", sans-serif;
      font-size: clamp(24px, 5.5vw, 40px);
      font-weight: 400;
      letter-spacing: 1.5px;
      line-height: 1;
      text-transform: uppercase;
    }

    .form-card {
      width: min(100%, 510px);
      margin: auto;
      padding: 23px;

      border: 1px solid rgba(255, 210, 54, 0.48);
      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(35, 8, 57, 0.88),
          rgba(8, 2, 14, 0.92)
        );

      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px rgba(255, 255, 255, 0.11);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .form-title {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 900;
    }

    .fields {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 10px;
    }

    select,
    input,
    button {
      font-family: "Roboto", Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      min-height: 54px;
      border: 2px solid transparent;
      border-radius: 12px;
      outline: none;
    }

    select {
      padding: 0 11px;
      color: #ffffff;
      background-color: #2d1a3d;
      cursor: pointer;
    }

    input {
      padding: 0 16px;
      color: #111111;
      background-color: #ffffff;
    }

    select:focus,
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.18);
    }

    .claim-button {
      width: 100%;
      min-height: 60px;
      margin-top: 13px;
      padding: 12px 20px;

      border: 0;
      border-radius: 999px;

      color: #170329;
      background:
        linear-gradient(
          #ffe880,
          #ffc400 58%,
          #f0a900
        );

      box-shadow:
        0 5px 0 #976000,
        0 12px 26px rgba(255, 196, 0, 0.3);

      font-family: "Anton", sans-serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;

      cursor: pointer;
      transition:
        transform 0.18s ease,
        filter 0.18s ease;
    }

    .claim-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .claim-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #976000;
    }

    .claim-button:disabled {
      cursor: wait;
      transform: none;
      filter: grayscale(0.35);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      margin-right: 9px;

      vertical-align: -4px;

      border: 3px solid rgba(20, 0, 30, 0.25);
      border-top-color: #180226;
      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    .claim-button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      display: none;
      margin: 12px 2px 0;
      padding: 11px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
    }

    .message.error {
      display: block;
      color: #ffd7d7;
      background-color: #5b1425;
    }

    .message.success {
      display: block;
      color: #dfffe6;
      background-color: #124b2c;
    }

    .privacy {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .terms {
      margin: 25px 0 0;
      color: #dfd7e7;
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    .terms span {
      margin: 0 8px;
      color: #8f6ea8;
    }

    @media (max-width: 620px) {
      body {
        background-attachment: scroll;
        background-position: center;
      }

      .page {
        padding-top: 27px;
      }

      .event-title::before,
      .event-title::after {
        width: 30px;
      }

      .headline {
        font-size: clamp(60px, 19vw, 88px);
      }

      .credit-title {
        margin-bottom: 18px;
      }

      .form-card {
        padding: 18px;
      }

      .fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <p class="event-title">
      AFL / NRL Finals
    </p>

    <h1 class="headline">
      Play 10
      <span class="gold">Get 50</span>
    </h1>

    <p class="credit-title">
      In Sports Credit
    </p>

    <section class="form-card">

      <p class="form-title">
        Enter your mobile number to claim
      </p>

      <form id="claimForm" novalidate>

        <div class="fields">

          <select
            id="countryCode"
            aria-label="Country code"
          >
            <option value="+61">
              🇦🇺 AUS (+61)
            </option>

            <option value="+64">
              🇳🇿 NZ (+64)
            </option>
          </select>

          <input
            id="mobileNumber"
            type="tel"
            inputmode="numeric"
            autocomplete="tel-national"
            placeholder="4xx xxx xxx"
            maxlength="14"
            aria-label="Mobile number"
            required
          >

        </div>

        <div
          id="message"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

        <button
          id="submitButton"
          class="claim-button"
          type="submit"
        >
          <span class="spinner"></span>
          <span class="button-text">Claim Now</span>
        </button>

        <p class="privacy">
          Your number is used to process this claim.
          One submission per mobile number.
        </p>

      </form>

    </section>

    <p class="terms">
      18+
      <span>|</span>
      T&amp;Cs Apply
      <span>|</span>
      Gamble Responsibly
    </p>

  </main>

  <script>
    /*
      IMPORTANT:
      Paste your deployed Google Apps Script Web App URL below.
    */

    const CONFIG = {
      sheetWebAppUrl:
        "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE",

      redirectUrl:
        "https://record.betzillopartners.com/_Lu3m47EoZY7T2Fu8bIPGIGNd7ZgqdRLk/20/",

      campaign:
        "AFL_NRL_FINALS_PLAY10_GET50",

      redirectDelayMs: 1000
    };

    const form =
      document.getElementById("claimForm");

    const mobileInput =
      document.getElementById("mobileNumber");

    const countryCode =
      document.getElementById("countryCode");

    const message =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");

    const buttonText =
      submitButton.querySelector(".button-text");

    mobileInput.addEventListener("input", function () {
      mobileInput.value =
        mobileInput.value.replace(/[^0-9 ]/g, "");

      hideMessage();
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function hideMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function validateMobile(number, code) {
      const cleanedNumber =
        number.replace(/\D/g, "").replace(/^0/, "");

      if (code === "+61") {
        return /^4\d{8}$/.test(cleanedNumber);
      }

      if (code === "+64") {
        return /^2\d{7,9}$/.test(cleanedNumber);
      }

      return false;
    }

    function getTrackingData() {
      const query =
        new URLSearchParams(window.location.search);

      return {
        utm_source: query.get("utm_source") || "",
        utm_medium: query.get("utm_medium") || "",
        utm_campaign: query.get("utm_campaign") || "",
        utm_content: query.get("utm_content") || "",
        utm_term: query.get("utm_term") || "",
        fbclid: query.get("fbclid") || ""
      };
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      hideMessage();

      const rawMobile =
        mobileInput.value.replace(/\D/g, "");

      const nationalMobile =
        rawMobile.replace(/^0/, "");

      if (
        !validateMobile(
          rawMobile,
          countryCode.value
        )
      ) {
        if (countryCode.value === "+61") {
          showMessage(
            "Enter a valid Australian mobile number, for example 4xx xxx xxx.",
            "error"
          );
        } else {
          showMessage(
            "Enter a valid New Zealand mobile number.",
            "error"
          );
        }

        mobileInput.focus();
        return;
      }

      if (
        CONFIG.sheetWebAppUrl.includes(
          "PASTE_YOUR_"
        )
      ) {
        showMessage(
          "Google Sheet connection is not configured yet.",
          "error"
        );

        return;
      }

      submitButton.disabled = true;
      submitButton.classList.add("loading");
      buttonText.textContent = "Saving...";

      const payload = {
        countryCode: countryCode.value,
        mobile: nationalMobile,

        fullMobile:
          countryCode.value + nationalMobile,

        campaign: CONFIG.campaign,
        pageUrl: window.location.href,
        submittedAt: new Date().toISOString(),

        ...getTrackingData()
      };

      try {
        const response = await fetch(
          CONFIG.sheetWebAppUrl,
          {
            method: "POST",

            /*
              text/plain prevents unnecessary CORS
              preflight with Google Apps Script.
            */
            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify(payload)
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message ||
            "Could not save your claim."
          );
        }

        if (result.duplicate) {
          showMessage(
            "This mobile number has already submitted a claim. Redirecting...",
            "success"
          );
        } else {
          showMessage(
            "Claim received successfully. Redirecting...",
            "success"
          );
        }

        setTimeout(function () {
          window.location.href =
            CONFIG.redirectUrl;
        }, CONFIG.redirectDelayMs);

      } catch (error) {
        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );

        submitButton.disabled = false;
        submitButton.classList.remove("loading");
        buttonText.textContent = "Claim Now";
      }
    });
  </script>

</body>
</html>
