<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061225">
  <meta name="description" content="New player sports offer — Bet 10 and get 50.">
  <title>Footy’s Biggest Stage — Bet 10 Get 50</title>
  <style>
    :root {
      --navy: #061225;
      --deep: #020a16;
      --white: #f7f9ff;
      --blue: #43b9ff;
      --blue-soft: #a4dcff;
      --yellow: #ffd13c;
      --yellow-light: #ffe77d;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--white);
      background: var(--deep);
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(28px, env(safe-area-inset-top)) clamp(16px, 4vw, 40px) max(26px, env(safe-area-inset-bottom));
      overflow: hidden;
      background: var(--navy) url("football-stadium-hero.png") center/cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(2,10,23,.64), rgba(2,10,23,.12) 25%, rgba(2,10,23,.08) 51%, rgba(2,10,23,.76) 81%, rgba(2,10,23,.98)),
        radial-gradient(circle at 50% 45%, rgba(4,24,48,.02) 0 30%, rgba(2,10,23,.34) 80%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0,0,0,.38);
    }

    .stage-title {
      display: grid;
      grid-template-columns: minmax(45px, 145px) auto minmax(45px, 145px);
      align-items: center;
      gap: clamp(15px, 3vw, 28px);
      width: min(100%, 720px);
      margin: 0;
      color: rgba(255,255,255,.94);
      font-size: clamp(.82rem, 2.3vw, 1.08rem);
      font-weight: 900;
      letter-spacing: clamp(.16em, .7vw, .30em);
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 3px 12px rgba(0,0,0,.8);
      animation: fade-down .65s ease-out both;
    }

    .stage-title::before,
    .stage-title::after {
      content: "";
      height: 2px;
      background: linear-gradient(90deg, transparent, #61c8ff);
    }

    .stage-title::after { transform: scaleX(-1); }

    .offer-card {
      width: min(590px, 94vw);
      margin-top: auto;
      padding: clamp(30px, 4vw, 46px) clamp(20px, 4vw, 40px) clamp(25px, 4vw, 38px);
      border: 1px solid rgba(157,188,225,.28);
      border-radius: 28px;
      text-align: center;
      background: linear-gradient(145deg, rgba(10,30,58,.74), rgba(3,12,27,.94));
      box-shadow: 0 26px 70px rgba(0,0,0,.58), inset 0 1px rgba(255,255,255,.07);
      backdrop-filter: blur(10px);
      animation: rise .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .offer-kicker {
      display: inline-block;
      margin: 0 0 10px;
      padding: 6px 15px;
      border-radius: 999px;
      color: var(--blue-soft);
      font-size: clamp(.76rem, 2.5vw, .92rem);
      font-weight: 900;
      letter-spacing: .15em;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(90deg, rgba(17,62,127,.95), rgba(29,67,143,.82));
    }

    .offer {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(5px, 1.5vw, 11px);
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-style: italic;
      line-height: .82;
      text-transform: uppercase;
      text-shadow: 0 7px rgba(0,0,0,.28), 0 12px 22px rgba(0,0,0,.45);
    }

    .offer-word {
      color: var(--white);
      font-size: clamp(2rem, 7.5vw, 3.55rem);
    }

    .offer-word.get { color: var(--blue); }

    .offer-number {
      color: var(--white);
      font-size: clamp(5.1rem, 19vw, 8.2rem);
      letter-spacing: -.035em;
    }

    .offer-number.reward {
      color: var(--yellow);
      text-shadow: 0 7px #9c6700, 0 13px 24px rgba(0,0,0,.48);
    }

    .offer-subtitle {
      margin: 11px 0 24px;
      color: rgba(255,255,255,.96);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(1.35rem, 5vw, 2rem);
      letter-spacing: .14em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(0,0,0,.7);
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 9px 13px;
      border: 1px solid rgba(142,176,214,.28);
      border-radius: 14px;
      background: rgba(1,10,24,.46);
    }

    .detail-icon {
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--blue);
      font-size: 1.35rem;
      font-weight: 900;
      background: rgba(26,88,139,.42);
    }

    .detail-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .detail-label {
      color: rgba(211,225,244,.78);
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .17em;
      line-height: 1;
      text-transform: uppercase;
    }

    .detail-value {
      margin-top: 3px;
      color: var(--white);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(1.15rem, 3.5vw, 1.55rem);
      letter-spacing: .025em;
      line-height: 1;
      text-transform: uppercase;
    }

    .claim-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      min-height: 64px;
      padding: 15px 24px;
      border: 1px solid #fff1a0;
      border-radius: 15px;
      color: #061225;
      font-size: clamp(1.12rem, 3.8vw, 1.42rem);
      font-weight: 1000;
      letter-spacing: .07em;
      text-decoration: none;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      box-shadow: 0 12px 28px rgba(255,193,21,.16), inset 0 2px rgba(255,255,255,.52);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
      animation: glow 2.6s ease-in-out infinite;
    }

    .claim-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
      box-shadow: 0 16px 32px rgba(255,193,21,.28), inset 0 2px rgba(255,255,255,.52);
    }

    .claim-button:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 4px;
    }

    .claim-button:active { transform: translateY(1px); }

    .claim-arrow {
      font-size: 1.65em;
      font-weight: 400;
      line-height: .7;
    }

    .responsible {
      margin: 15px 0 0;
      color: rgba(227,237,250,.70);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .075em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
    }

    @media (min-width: 760px) {
      .offer-card { margin-bottom: clamp(5px, 2vh, 24px); }
    }

    @media (max-width: 560px) {
      .hero {
        padding-inline: 12px;
        background-position: center top;
      }

      .hero::before {
        background: linear-gradient(180deg, rgba(2,10,23,.68), rgba(2,10,23,.17) 26%, rgba(2,10,23,.28) 50%, rgba(2,10,23,.88) 72%, rgba(2,10,23,.99));
      }

      .stage-title {
        grid-template-columns: minmax(25px, 1fr) auto minmax(25px, 1fr);
        gap: 12px;
        font-size: clamp(.7rem, 3.1vw, .86rem);
        letter-spacing: .18em;
      }

      .offer-card {
        width: 100%;
        padding: 27px 16px 20px;
        border-radius: 24px;
      }

      .offer { gap: 5px; }
      .offer-subtitle { margin-bottom: 20px; }
      .details { gap: 8px; }

      .detail {
        gap: 7px;
        min-height: 54px;
        padding-inline: 7px;
      }

      .detail-icon {
        width: 30px;
        height: 30px;
        font-size: 1.12rem;
      }

      .detail-label { font-size: .56rem; }
      .claim-button { min-height: 60px; }
    }

    @media (max-width: 360px) {
      .offer-card { padding-inline: 11px; }
      .details { grid-template-columns: 1fr; }
      .detail { min-height: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <p class="stage-title">Footy’s Biggest Stage</p>

    <section class="offer-card" aria-labelledby="offer-title">
      <p class="offer-kicker">New Player Offer</p>

      <h1 class="offer" id="offer-title" aria-label="Bet 10, get 50">
        <span class="offer-word">Bet</span>
        <span class="offer-number">10</span>
        <span class="offer-word get">Get</span>
        <span class="offer-number reward">50</span>
      </h1>

      <p class="offer-subtitle">Sports Offer</p>

      <div class="details" aria-label="Offer details">
        <div class="detail">
          <span class="detail-icon" aria-hidden="true">↓</span>
          <span class="detail-copy">
            <span class="detail-label">Minimum deposit</span>
            <span class="detail-value">$30</span>
          </span>
        </div>

        <div class="detail">
          <span class="detail-icon" aria-hidden="true">↗</span>
          <span class="detail-copy">
            <span class="detail-label">Instant</span>
            <span class="detail-value">Withdrawal</span>
          </span>
        </div>
      </div>

      <a
        class="claim-button"
        href="https://record.betzillopartners.com/_Lu3m47EoZY6ZM7hnoUx_dWNd7ZgqdRLk/14/"
        rel="noopener sponsored"
        aria-label="Claim the new player sports offer"
      >
        <span>Claim Now</span>
        <span class="claim-arrow" aria-hidden="true">→</span>
      </a>

      <p class="responsible">18+ &nbsp;•&nbsp; T&amp;Cs apply &nbsp;•&nbsp; Gamble responsibly</p>
    </section>
  </main>
</body>
</html>
