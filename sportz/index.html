    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(2,10,23,.54), rgba(2,10,23,.04) 24%, rgba(2,10,23,.02) 49%, rgba(2,10,23,.58) 79%, rgba(2,10,23,.90)),
        radial-gradient(circle at 50% 40%, transparent 0 31%, rgba(2,10,23,.22) 82%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0,0,0,.38);
    }

    .stage-title {
      display: grid;
      grid-template-columns: minmax(45px, 145px) auto minmax(45px, 145px);
      align-items: center;
      gap: clamp(15px, 3vw, 28px);
      width: min(100%, 720px);
      margin: 0;
      color: rgba(255,255,255,.94);
      font-size: clamp(.82rem, 2.3vw, 1.08rem);
      font-weight: 900;
      letter-spacing: clamp(.16em, .7vw, .30em);
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 3px 12px rgba(0,0,0,.8);
      animation: fade-down .65s ease-out both;
    }

    .stage-title::before,
    .stage-title::after {
      content: "";
      height: 2px;
      background: linear-gradient(90deg, transparent, #61c8ff);
    }

    .stage-title::after { transform: scaleX(-1); }

    .offer-card {
      position: relative;

      backdrop-filter: blur(12px);
      animation: rise .75s cubic-bezier(.2,.8,.2,1) both;

      position: absolute;
      inset: 0 12%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(85,197,255,.92), transparent);

      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(90deg, rgba(17,62,127,.95), rgba(29,67,143,.82));
    }

    .offer {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(5px, 1.5vw, 11px);
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-style: italic;
      line-height: .82;
      text-transform: uppercase;

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 17px;
    }

    .detail {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 9px 13px;
      border: 1px solid rgba(142,176,214,.28);

    }

    .detail-icon {
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--blue);
      font-size: 1.35rem;
      font-weight: 900;
      background: rgba(26,88,139,.42);
    }

    .detail-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .detail-label {
      color: rgba(211,225,244,.78);
      font-size: .64rem;
      font-weight: 900;
      letter-spacing: .17em;
      line-height: 1;
      text-transform: uppercase;
    }

    .detail-value {
      margin-top: 3px;
      color: var(--white);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(1.15rem, 3.5vw, 1.55rem);

    }

    .claim-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      min-height: 62px;
      padding: 15px 24px;

      font-size: clamp(1.12rem, 3.8vw, 1.42rem);
      font-weight: 1000;
      letter-spacing: .07em;
      text-decoration: none;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      box-shadow: 0 12px 28px rgba(255,193,21,.16), inset 0 2px rgba(255,255,255,.52);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
      animation: glow 2.6s ease-in-out infinite;
    }

    .claim-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
      box-shadow: 0 16px 32px rgba(255,193,21,.28), inset 0 2px rgba(255,255,255,.52);

    .claim-button:focus-visible {

      outline-offset: 4px;
    }

    .claim-button:active { transform: translateY(1px); }

    .claim-arrow {
      font-size: 1.65em;
      font-weight: 400;
      line-height: .7;
    }

    .responsible {
      margin: 13px 0 0;
      color: rgba(227,237,250,.70);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .075em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
    }

    @media (max-width: 560px) {
      .hero {
        padding: max(17px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
        background-position: center center;
      }

      .hero::before {
        background: linear-gradient(180deg, rgba(2,10,23,.58), rgba(2,10,23,.06) 25%, rgba(2,10,23,.13) 48%, rgba(2,10,23,.74) 75%, rgba(2,10,23,.94));
      }

      .stage-title {
        grid-template-columns: minmax(25px, 1fr) auto minmax(25px, 1fr);
        gap: 12px;
        font-size: clamp(.7rem, 3.1vw, .86rem);
        letter-spacing: .18em;
      }

      .offer-card {
        width: 100%;
        margin-top: clamp(58px, 9vh, 84px);
        padding: 24px 14px 18px;
        border-radius: 22px;
      }

      .offer { gap: 5px; }
      .offer-subtitle { margin-bottom: 16px; }
      .details { gap: 8px; }

      .detail {
        gap: 7px;

      }

      .detail-icon {

        height: 30px;
        font-size: 1.12rem;
      }

    }

    @media (max-width: 360px) {
      .offer-card { padding-inline: 11px; }
      .details { grid-template-columns: 1fr; }
      .detail { min-height: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
